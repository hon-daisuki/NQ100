<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NQ100 Tokyo Scalp Strategy</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #1b1f24;
        --muted: #69717d;
        --line: #d8dde5;
        --accent: #0f766e;
        --accent-2: #b45309;
        --bad: #b42318;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --panel: #181d23;
          --ink: #eef2f6;
          --muted: #aab3bf;
          --line: #2d3540;
          --accent: #2dd4bf;
          --accent-2: #fbbf24;
          --bad: #fb7185;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      header,
      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }

      header {
        padding: 28px 0 18px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: 0;
      }

      .sub {
        margin: 0;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin: 16px 0;
      }

      .panel,
      .metric {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .metric {
        padding: 14px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .metric strong {
        display: block;
        margin-top: 4px;
        font-size: 24px;
      }

      .panel {
        padding: 16px;
        margin: 14px 0;
      }

      h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }

      .model-rule {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .rule-item {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
      }

      .rule-item span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      .rule-item strong {
        display: block;
        margin-top: 2px;
      }

      .notice {
        border-left: 4px solid var(--accent-2);
        padding: 10px 12px;
        background: color-mix(in srgb, var(--accent-2) 12%, transparent);
        color: var(--ink);
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 8px 10px;
        text-align: right;
        white-space: nowrap;
      }

      th:first-child,
      td:first-child,
      th:nth-child(2),
      td:nth-child(2) {
        text-align: left;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .good {
        color: var(--accent);
        font-weight: 700;
      }

      .risk {
        color: var(--bad);
      }

      footer {
        width: min(1180px, calc(100% - 32px));
        margin: 20px auto 34px;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 820px) {
        .grid,
        .model-rule {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 560px) {
        .grid,
        .model-rule {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>NQ100 Tokyo Scalp Strategy</h1>
      <p class="sub">東京時間の短期保有を、トレード結果から逆算して学習した候補モデルです。</p>
    </header>
    <main>
      <section class="grid" id="metrics"></section>

      <section class="panel">
        <h2>Best Model</h2>
        <div class="model-rule" id="best-rule"></div>
      </section>

      <section class="panel">
        <h2>Risk Note</h2>
        <p class="notice" id="risk-note">
          勝率80%以上は探索条件を満たした候補であり、実運用の利益を保証するものではありません。
          特に小さい利確幅と大きい損切り幅の組み合わせは、勝率が高くても1回の負けが重くなります。
        </p>
      </section>

      <section class="panel">
        <h2>Top Candidates</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Side</th>
                <th>Filters</th>
                <th>TP</th>
                <th>SL</th>
                <th>Hold</th>
                <th>Test Trades</th>
                <th>Test Win</th>
                <th>Avg Pts</th>
                <th>PF</th>
                <th>Total Pts</th>
                <th>Worst</th>
              </tr>
            </thead>
            <tbody id="candidate-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer id="meta"></footer>

    <script>
      const fmtPct = (value) => `${(value * 100).toFixed(1)}%`;
      const fmtNum = (value, digits = 2) => Number(value).toFixed(digits);

      function addMetric(label, value, className = "") {
        const box = document.createElement("div");
        box.className = "metric";
        box.innerHTML = `<span>${label}</span><strong class="${className}">${value}</strong>`;
        document.querySelector("#metrics").appendChild(box);
      }

      function addRule(label, value) {
        const item = document.createElement("div");
        item.className = "rule-item";
        item.innerHTML = `<span>${label}</span><strong>${value}</strong>`;
        document.querySelector("#best-rule").appendChild(item);
      }

      function filterText(filters) {
        return Object.entries(filters)
          .map(([key, value]) => `${key}: ${value}`)
          .join(", ");
      }

      fetch("./tokyo_scalp_results.json")
        .then((response) => response.json())
        .then((data) => {
          const best = data.best_model;
          if (!best) {
            addMetric("Candidate Models", "0", "risk");
            document.querySelector("#best-rule").textContent =
              "80%以上の勝率条件を満たす候補はありませんでした。";
            return;
          }

          addMetric("Candidate Models", data.candidate_models);
          addMetric("Best Test Win", fmtPct(best.test_win_rate), "good");
          addMetric("Best Test Trades", best.test_trades);
          addMetric("Best Profit Factor", fmtNum(best.test_profit_factor), "good");

          addRule("Direction", best.config.side);
          addRule("Take Profit", `${best.config.take_profit_points} points`);
          addRule("Stop Loss", `${best.config.stop_loss_points} points`);
          addRule("Max Hold", `${best.config.max_hold_minutes} minutes`);
          addRule("Filters", filterText(best.filters));
          addRule("Test Result", `${fmtPct(best.test_win_rate)} / ${best.test_trades} trades`);

          const rows = document.querySelector("#candidate-rows");
          data.top_models.forEach((model) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${model.config.side}</td>
              <td>${filterText(model.filters)}</td>
              <td>${model.config.take_profit_points}</td>
              <td>${model.config.stop_loss_points}</td>
              <td>${model.config.max_hold_minutes}</td>
              <td>${model.test_trades}</td>
              <td class="good">${fmtPct(model.test_win_rate)}</td>
              <td>${fmtNum(model.test_avg_points)}</td>
              <td>${fmtNum(model.test_profit_factor)}</td>
              <td>${fmtNum(model.test_total_points, 1)}</td>
              <td class="risk">${fmtNum(model.test_max_loss_points, 1)}</td>
            `;
            rows.appendChild(tr);
          });

          document.querySelector("#meta").textContent =
            `${data.date_start} 〜 ${data.date_end} / minute rows ${data.minute_rows.toLocaleString()} / target win ${fmtPct(data.target_win_rate)}`;
        })
        .catch((error) => {
          document.querySelector("#metrics").textContent = `Failed to load results: ${error}`;
        });
    </script>
  </body>
</html>
